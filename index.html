<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="google" content="notranslate" />
  <meta name="googlebot" content="notranslate" />
  <meta name="description" content="Vanguard of Fate — An action RPG and isekai fantasy chronicle built with HTML5 Canvas." />
  <meta name="theme-color" content="#0b0f19" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚔️</text></svg>" />
  <title>Vanguard of Fate</title>

  <!-- Google Fonts: Cinzel & Silkscreen -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Silkscreen:wght@400;700&display=swap" />

  <!-- Game Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/title.css" />
  <link rel="stylesheet" href="css/creator.css" />
  <link rel="stylesheet" href="css/dialog.css" />
</head>
<body data-mode="title" class="notranslate" translate="no">

  <!-- ================================================================= -->
  <!-- 1. TITLE SCREEN                                                   -->
  <!-- Full-window HTML/CSS interface with canvas particle overlay       -->
  <!-- ================================================================= -->
  <section id="title" data-step="press" aria-label="Title Screen">
    <div class="t-bg" aria-hidden="true"></div>
    <canvas id="titleFx" aria-hidden="true"></canvas>
    <div class="t-fog t-fog-a" aria-hidden="true"></div>
    <div class="t-fog t-fog-b" aria-hidden="true"></div>
    <div class="t-shade" aria-hidden="true"></div>

    <!-- Language Selector Toggle -->
    <button type="button" class="t-lang" id="langToggle" tabindex="-1" title="Language / Wika (L)" aria-label="Toggle language">
      <span data-lang="en">EN</span><span data-lang="fil">FIL</span>
    </button>

    <!-- Main Title Logo -->
    <header class="t-logo">
      <h1>Vanguard <em>of</em> Fate</h1>
      <p class="t-sub" data-i18n="subtitle"></p>
    </header>

    <!-- Press Any Key Prompt -->
    <p class="t-press" data-i18n="pressAnyKey"></p>

    <!-- Navigation Menu (Dynamically populated) -->
    <nav class="t-menu" id="titleMenu" aria-label="Title Menu"></nav>

    <!-- Chronicles Modal (Lore Chapters) -->
    <div class="t-chron" id="chronicles" role="dialog" aria-modal="true" aria-labelledby="chronTitle">
      <div class="c-panel">
        <div class="c-head">
          <h2 id="chronTitle"></h2>
          <button type="button" class="c-close" id="chronClose" aria-label="Close Chronicles">✕</button>
        </div>
        <div class="c-tabs" id="chronTabs" role="tablist"></div>
        <div class="c-body" id="chronBody" tabindex="0"></div>
        <p class="c-note" id="chronNote"></p>
      </div>
    </div>

    <!-- Credits Modal -->
    <div class="t-chron t-credits" id="credits" role="dialog" aria-modal="true" aria-labelledby="credTitle">
      <div class="c-panel">
        <div class="c-head">
          <h2 id="credTitle"></h2>
          <button type="button" class="c-close" id="credClose" aria-label="Close Credits">✕</button>
        </div>
        <div class="c-body cr-body" id="credBody" tabindex="0"></div>
      </div>
    </div>

    <!-- Title Footer -->
    <footer class="t-foot">
      <span class="t-hint" id="titleHint"></span>
      <span class="t-tag" data-i18n="tagline"></span>
    </footer>
  </section>

  <!-- ================================================================= -->
  <!-- 2. CHARACTER CREATOR                                              -->
  <!-- Novice appearance customization and preview                       -->
  <!-- ================================================================= -->
  <section id="creator" aria-label="Character Creator">
    <div class="cr-bg" aria-hidden="true"></div>
    <div class="cr-layout">
      <!-- Left Stage: Hero Preview & Controls -->
      <div class="cr-stage">
        <h2 class="cr-title" data-i18n="crTitle"></h2>
        <p class="cr-sub" data-i18n="crSub"></p>
        
        <div class="cr-pedestal">
          <canvas id="crPreview" aria-label="Character preview" role="img"></canvas>
        </div>

        <!-- Utility Bar: Home / Rotate Dial / Pose / Fullscreen -->
        <div class="cr-util">
          <button type="button" id="crHome" title="Esc" aria-label="Return to Main Menu">
            <b>⌂</b><span data-i18n="crHome"></span>
          </button>
          <div class="cr-dial-wrap">
            <div class="cr-dial" id="crDial" title="Q / E" role="slider" tabindex="0" aria-label="Rotate Character" aria-valuenow="0" aria-valuemin="0" aria-valuemax="3" aria-valuetext="Facing Down">
              <span class="cr-dial-mark m-down"></span><span class="cr-dial-mark m-right"></span>
              <span class="cr-dial-mark m-up"></span><span class="cr-dial-mark m-left"></span>
              <i class="cr-dial-needle" id="crDialNeedle"></i>
            </div>
            <span class="cr-dial-label" id="crDialLabel"></span>
          </div>
          <button type="button" id="crPose" title="V" aria-label="Toggle Pose Animation">
            <b id="crPoseIcon"></b><span id="crPoseLabel"></span>
          </button>
          <button type="button" id="crFull" title="F" aria-label="Toggle Fullscreen">
            <b id="crFullIcon"></b><span id="crFullLabel"></span>
          </button>
        </div>

        <div class="cr-trio" aria-hidden="true">
          <canvas></canvas><canvas></canvas><canvas></canvas>
        </div>
        <p class="cr-summoner" id="crSummoner"></p>
      </div>

      <!-- Right Panel: Customization Options & Actions -->
      <div class="cr-panel">
        <label class="cr-name" for="crName">
          <span data-i18n="crName"></span>
          <input id="crName" type="text" maxlength="12" autocomplete="off" spellcheck="false" />
        </label>
        <div class="cr-rows" id="crRows"></div>
        <div class="cr-actions">
          <button type="button" id="crBack" data-i18n="back"></button>
          <button type="button" id="crRandom" data-i18n="crRandom"></button>
          <button type="button" id="crBegin" class="primary" data-i18n="crBegin"></button>
        </div>
      </div>
    </div>
    <footer class="cr-foot" id="crHint"></footer>
  </section>

  <!-- ================================================================= -->
  <!-- 2.5 ACT I PROLOGUE CINEMATIC MODAL                                -->
  <!-- ================================================================= -->
  <section id="prologue" class="prologue-modal" aria-label="Prologue: Act I" tabindex="-1">
    <div class="pro-backdrop"></div>
    <div class="pro-panel">
      <div class="pro-banner-wrap">
        <img id="prologueBanner" src="assets/banner/act-1.jpeg" alt="Act I Banner" />
        <div class="pro-banner-overlay"></div>
      </div>
      <div class="pro-content">
        <div class="pro-header">
          <span class="pro-tag">PROLOGUE · SALAYSAY NG AETHELGARD</span>
          <h2 id="prologueTitle"></h2>
          <h3 id="prologueSub"></h3>
        </div>
        <div class="pro-body" id="prologueText"></div>
        <div class="pro-footer">
          <div class="pro-dots" id="prologueDots"></div>
          <div class="pro-buttons">
            <button type="button" id="prologueSkip" class="btn-secondary">Laktawan (ESC)</button>
            <button type="button" id="prologueNext" class="btn-primary">SUSUNOD ↵</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ================================================================= -->
  <!-- 3. GAME APPLICATION (STAGE & LORE SIDEBAR)                        -->
  <!-- ================================================================= -->
  <div id="app">
    <!-- Main Game Viewport -->
    <main id="stage">
      <div id="viewport">
        <canvas id="gameCanvas" width="480" height="270" aria-label="Game World" role="img"></canvas>

        <!-- HTML Overlays: Toasts, Quest log, Inventory, Character sheet, Dialog -->
        <div id="questToast" aria-live="polite"></div>
        <div id="questLog"></div>
        <div id="inventory"></div>
        <div id="character"></div>

        <div id="dialog" role="dialog" aria-label="Dialogue" aria-live="assertive">
          <canvas id="dlgPortrait" aria-hidden="true"></canvas>
          <div class="dlg-body">
            <div id="dlgName"></div>
            <p id="dlgText"></p>
          </div>
          <span id="dlgNext" aria-hidden="true">▼</span>
        </div>
      </div>

      <!-- Bottom Bar: Hero selection picker & HUD control hints -->
      <div id="bar">
        <div id="picker"></div>
        <div class="hud" id="hudText" aria-live="polite"></div>
      </div>
    </main>

    <!-- Sidebar: Lore Tracker, Player Status HUD, Actions & Dossier -->
    <aside id="lore" aria-label="Game Information and Controls">
      <div class="lore-head" id="sideHead"></div>

      <!-- Side Lore Auto-scroll Section -->
      <section class="side-lore" aria-label="Lore Overview">
        <div class="lore-view"><div class="lore-track"></div></div>
        <button type="button" class="lore-more" id="loreMore" tabindex="-1"></button>
      </section>

      <!-- Side HUD: Hero Portrait, Vitals, Quest Tracker & Field Info -->
      <section class="side-ui" id="hudBar" aria-label="Hero Status and Field State">
        <div class="hb-hero">
          <div class="hb-portrait" id="hbInitial"></div>
          <div class="hb-info">
            <div class="hb-row">
              <span class="hb-name" id="hbName"></span>
              <span class="hb-level" id="hbLevel"></span>
            </div>
            <div class="hb-class" id="hbClass"></div>
            <div class="hb-meter hp"><i id="hbHp"></i><span id="hbHpText"></span></div>
            <div class="hb-meter st" id="hbStBox" title="Stamina"><i id="hbSt"></i></div>
            <div class="hb-meter xp"><i id="hbXp"></i></div>
            <div class="hb-status" id="hbStatus"></div>
          </div>
        </div>

        <div class="hb-quest" id="questTracker">
          <div id="qtAct"></div>
          <div id="qtGoal"></div>
        </div>

        <div class="hb-field">
          <div><span class="hb-k" id="hbFoesK"></span> <b class="c-foe" id="hbFoes"></b></div>
          <div><span class="hb-k" id="hbLootK"></span> <b class="c-loot" id="hbLoot"></b></div>
          <div><span id="hbGold" class="c-gold"></span></div>
          <div><span id="hbWeather"></span></div>
          <div class="hb-zone" id="hbZone"></div>
        </div>
      </section>

      <!-- Side Actions: Skills, Belt Quick-items & Menu Buttons -->
      <section class="side-actions" id="sideActions" aria-label="Actions and Skills">
        <div class="sa-label" id="saSkillsLabel"></div>
        <div class="sa-grid" id="saSkills"></div>
        <div class="sa-label" id="saBeltLabel"></div>
        <div class="sa-grid belt" id="saBelt"></div>
        <div class="sa-label" id="saOptionsLabel"></div>
        <div class="sa-grid" id="saOptions"></div>
      </section>

      <!-- Awakening Dossier View (when choosing class) -->
      <div class="dossier" id="dossier"></div>
    </aside>
  </div>

  <!-- ================================================================= -->
  <!-- 4. MODALS & AUXILIARY ELEMENTS                                    -->
  <!-- ================================================================= -->

  <!-- Full Act Reader ("Read More" Story Modal) -->
  <section id="actReader" role="dialog" aria-modal="true" aria-labelledby="arTitle">
    <div class="ar-panel">
      <div class="ar-head">
        <h2 id="arTitle"></h2>
        <button type="button" class="ar-close" id="arClose" aria-label="Close Act Reader" tabindex="-1">✕</button>
      </div>
      <div class="ar-tabs" id="arTabs" role="tablist"></div>
      <div class="ar-body" id="arBody" tabindex="0"></div>
      <p class="ar-hint" id="arHint"></p>
    </div>
  </section>

  <!-- Screen Flash Transition Effect -->
  <div id="flash" aria-hidden="true"></div>

  <!-- Hidden File Input for Secure Save Import (.vof, .sav, .json) -->
  <input type="file" id="saveFileInput" accept=".vof,.sav,.json" style="display: none;" aria-hidden="true" />

  <!-- Entry Script -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
