<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vanguard of Fate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Silkscreen:wght@400;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/title.css" />
</head>
<body data-mode="title">

  <!-- Title screen: buong window, HTML/CSS (hindi canvas) para malinaw ang logo at menu -->
  <section id="title" data-step="press">
    <div class="t-bg"></div>
    <canvas id="titleFx"></canvas>
    <div class="t-fog t-fog-a"></div>
    <div class="t-fog t-fog-b"></div>
    <div class="t-shade"></div>

    <button type="button" class="t-lang" id="langToggle" tabindex="-1" title="Language / Wika (L)">
      <span data-lang="en">EN</span><span data-lang="fil">FIL</span>
    </button>

    <header class="t-logo">
      <h1>Vanguard <em>of</em> Fate</h1>
      <p class="t-sub" data-i18n="subtitle"></p>
    </header>

    <p class="t-press" data-i18n="pressAnyKey"></p>
    <nav class="t-menu" id="titleMenu"></nav>

    <div class="t-chron" id="chronicles">
      <div class="c-panel">
        <div class="c-head">
          <h2 id="chronTitle"></h2>
          <button type="button" class="c-close" id="chronClose" aria-label="Close">✕</button>
        </div>
        <div class="c-tabs" id="chronTabs"></div>
        <div class="c-body" id="chronBody"></div>
        <p class="c-note" id="chronNote"></p>
      </div>
    </div>

    <footer class="t-foot">
      <span class="t-hint" id="titleHint"></span>
      <span class="t-tag" data-i18n="tagline"></span>
    </footer>
  </section>

  <div id="app">
    <main id="stage">
      <canvas id="gameCanvas" width="480" height="270"></canvas>

      <!-- Ibaba: hero picker (select) / control hints -->
      <div id="bar">
        <div id="picker"></div>
        <div class="hud" id="hudText"></div>
      </div>
    </main>

    <!-- Kanan: lore auto-loop (laro) / dossier ng hero (select) -->
    <aside id="lore">
      <div class="lore-head" id="sideHead"></div>
      <div class="lore-view"><div class="lore-track"></div></div>
      <div class="dossier" id="dossier"></div>
    </aside>
  </div>

  <!-- Puting flash kapag pumili sa title menu -->
  <div id="flash"></div>

  <!-- Nakatagong file input para sa .json import -->
  <input type="file" id="saveFileInput" accept=".json" style="display: none;" />

  <script type="module" src="js/main.js"></script>
</body>
</html>
