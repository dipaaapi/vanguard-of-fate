<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vanguard of Fate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Silkscreen:wght@400;700&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/title.css" />
  <link rel="stylesheet" href="css/creator.css" />
  <link rel="stylesheet" href="css/dialog.css" />
</head>
<body data-mode="title">

  <!-- Title screen: buong window, HTML/CSS (hindi canvas) para malinaw ang logo at menu -->
  <section id="title" data-step="press">
    <div class="t-bg"></div>
    <canvas id="titleFx"></canvas>
    <div class="t-fog t-fog-a"></div>
    <div class="t-fog t-fog-b"></div>
    <div class="t-shade"></div>

    <button type="button" class="t-lang" id="langToggle" tabindex="-1" title="Language / Wika (L)">
      <span data-lang="en">EN</span><span data-lang="fil">FIL</span>
    </button>

    <header class="t-logo">
      <h1>Vanguard <em>of</em> Fate</h1>
      <p class="t-sub" data-i18n="subtitle"></p>
    </header>

    <p class="t-press" data-i18n="pressAnyKey"></p>
    <nav class="t-menu" id="titleMenu"></nav>

    <div class="t-chron" id="chronicles">
      <div class="c-panel">
        <div class="c-head">
          <h2 id="chronTitle"></h2>
          <button type="button" class="c-close" id="chronClose" aria-label="Close">✕</button>
        </div>
        <div class="c-tabs" id="chronTabs"></div>
        <div class="c-body" id="chronBody"></div>
        <p class="c-note" id="chronNote"></p>
      </div>
    </div>

    <footer class="t-foot">
      <span class="t-hint" id="titleHint"></span>
      <span class="t-tag" data-i18n="tagline"></span>
    </footer>
  </section>

  <!-- Character Creator: likhain ang Novice (ang class ay sa Job Awakening na) -->
  <section id="creator">
    <div class="cr-bg"></div>
    <div class="cr-layout">
      <div class="cr-stage">
        <h2 class="cr-title" data-i18n="crTitle"></h2>
        <p class="cr-sub" data-i18n="crSub"></p>
        <div class="cr-pedestal">
          <canvas id="crPreview"></canvas>
        </div>
        <div class="cr-controls">
          <button type="button" id="crRotL" title="Q">⟲</button>
          <button type="button" id="crWalk" data-i18n="crWalk"></button>
          <button type="button" id="crRotR" title="E">⟳</button>
        </div>
        <div class="cr-trio"><canvas></canvas><canvas></canvas><canvas></canvas></div>
        <p class="cr-summoner" id="crSummoner"></p>
      </div>

      <div class="cr-panel">
        <label class="cr-name">
          <span data-i18n="crName"></span>
          <input id="crName" type="text" maxlength="12" autocomplete="off" spellcheck="false" />
        </label>
        <div class="cr-rows" id="crRows"></div>
        <div class="cr-actions">
          <button type="button" id="crBack" data-i18n="back"></button>
          <button type="button" id="crRandom" data-i18n="crRandom"></button>
          <button type="button" id="crBegin" class="primary" data-i18n="crBegin"></button>
        </div>
      </div>
    </div>
    <footer class="cr-foot" id="crHint"></footer>
  </section>

  <div id="app">
    <main id="stage">
      <!-- Game screen + mga HTML overlay (dialogue, quest) -->
      <div id="viewport">
        <canvas id="gameCanvas" width="480" height="270"></canvas>

        <div id="questTracker">
          <div id="qtAct"></div>
          <div id="qtGoal"></div>
        </div>
        <div id="questToast"></div>
        <div id="questLog"></div>

        <div id="dialog">
          <canvas id="dlgPortrait"></canvas>
          <div class="dlg-body">
            <div id="dlgName"></div>
            <p id="dlgText"></p>
          </div>
          <span id="dlgNext">▼</span>
        </div>
      </div>

      <!-- Ibaba: hero picker (select) / control hints -->
      <div id="bar">
        <div id="picker"></div>
        <div class="hud" id="hudText"></div>
      </div>
    </main>

    <!-- Kanan: lore auto-loop (laro) / dossier ng hero (select) -->
    <aside id="lore">
      <div class="lore-head" id="sideHead"></div>
      <div class="lore-view"><div class="lore-track"></div></div>
      <div class="dossier" id="dossier"></div>
    </aside>
  </div>

  <!-- Puting flash kapag pumili sa title menu -->
  <div id="flash"></div>

  <!-- Nakatagong file input para sa .json import -->
  <input type="file" id="saveFileInput" accept=".json" style="display: none;" />

  <script type="module" src="js/main.js"></script>
</body>
</html>
